<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff1e27"/>
      <stop offset="50%" stop-color="#e50914"/>
      <stop offset="100%" stop-color="#990000"/>
    </linearGradient>

    <!-- Glowing Rim Gradient -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>

    <!-- Play Icon Gradient -->
    <linearGradient id="playGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#e50914" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Base Rounded Container with Shadow -->
  <rect x="40" y="40" width="432" height="432" rx="110" fill="url(#bgGrad)" filter="url(#glow)"/>

  <!-- Subtle Rim Border -->
  <rect x="42" y="42" width="428" height="428" rx="108" fill="none" stroke="url(#rimGrad)" stroke-width="4"/>

  <!-- Film Roll Sprocket Holes (Top & Bottom subtle details) -->
  <g fill="#ffffff" opacity="0.25">
    <rect x="90" y="70" width="28" height="20" rx="6"/>
    <rect x="140" y="70" width="28" height="20" rx="6"/>
    <rect x="190" y="70" width="28" height="20" rx="6"/>
    <rect x="240" y="70" width="28" height="20" rx="6"/>
    <rect x="290" y="70" width="28" height="20" rx="6"/>
    <rect x="340" y="70" width="28" height="20" rx="6"/>
    <rect x="390" y="70" width="28" height="20" rx="6"/>

    <rect x="90" y="422" width="28" height="20" rx="6"/>
    <rect x="140" y="422" width="28" height="20" rx="6"/>
    <rect x="190" y="422" width="28" height="20" rx="6"/>
    <rect x="240" y="422" width="28" height="20" rx="6"/>
    <rect x="290" y="422" width="28" height="20" rx="6"/>
    <rect x="340" y="422" width="28" height="20" rx="6"/>
    <rect x="390" y="422" width="28" height="20" rx="6"/>
  </g>

  <!-- Large Central CineVerse "C" & Cinema Play Triangle -->
  <!-- Bold Stylized Play Arrow -->
  <path d="M210 160 C210 148 224 140 234 146 L356 238 C366 246 366 266 356 274 L234 366 C224 372 210 364 210 352 Z" fill="url(#playGrad)"/>
</svg>
